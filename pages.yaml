# pages.yaml
media:
  input: public/images/blog
  output: /images/blog

collections:
  - name: blog
    label: Blog Posts
    path: src/content/blog/*.md
    fields:
      - name: title
        type: string
        label: Title
      - name: description
        type: string
        label: Description
      - name: pubDate
        type: datetime
        label: Publish Date
      - name: updatedDate
        type: datetime
        label: Updated Date
      - name: heroImage
        type: image
        label: Hero Image
      - name: author
        type: string
        label: Author
        default: 'SpeedwayWorld WebTeam'
